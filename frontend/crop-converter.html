<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crop Converter - Agri Marketplace</title>
  <link rel="stylesheet" href="homee.css">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">

  <style>
    .converter-section {
      max-width: 600px;
      margin: 60px auto;
      padding: 40px;
      background: #ffffffdd;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: center;
    }

    .converter-section h2 {
      font-family: 'Oswald', sans-serif;
      color: #4b8f2f;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .converter-section input {
      width: 90%;
      padding: 12px;
      margin-top: 20px;
      border-radius: 8px;
      border: 2px solid #4b8f2f;
      font-size: 18px;
    }

    .converter-section button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #4b8f2f;
      color: white;
      border: none;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .converter-section button:hover {
      background: #3c6e24;
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      color: #333;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <h1>AGRI<span>MARKETPLACE</span></h1>
    <p>FAIR TRADE MADE EASY</p>
  </div>
</header>

<div class="converter-section">
  <h2>Crop Weight Converter</h2>

  <input type="number" id="inputKg" placeholder="Enter Weight (kg)">
  <button onclick="convert()">Convert</button>

  <div id="result"></div>
</div>

<footer>
  <p>© 2025 Agri Marketplace — All Rights Reserved</p>
</footer>

<script>
function convert() {
  let kg = parseFloat(document.getElementById("inputKg").value);
  if (!kg || kg <= 0) {
    document.getElementById("result").innerHTML = "Please enter a valid number.";
    return;
  }

  let quintal = kg / 100;
  let tonne = kg / 1000;

  document.getElementById("result").innerHTML = `
    <b>${kg} kg</b><br><br>
    = <b>${quintal.toFixed(2)}</b> Quintals<br>
    = <b>${tonne.toFixed(3)}</b> Tonnes
  `;
}
</script>

</body>
</html>
