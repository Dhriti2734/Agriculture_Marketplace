<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriMarketplace | Sign Up</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <header>
    <h1>AGRIMARKETPLACE</h1>
    <p>FAIRTRADE MADE EASY</p>
    <nav>
      <a href="#">HOME</a>
      <a href="#">MARKET</a>
      <a href="#">CROP CONVERTER</a>
      <a href="#">ABOUT US</a>
    </nav>
  </header>

  <section class="signup-container">
    <h2>SIGN UP</h2>
    <p>If you are already registered <a href="login.html">Login here</a>.</p>


    <form>
      <div class="form-row">
        <label>I am*</label>
        <div class="radio-group">
          <label><input type="radio" name="role"> Buyer</label>
          <label><input type="radio" name="role"> Seller</label>
          <label><input type="radio" name="role"> Both</label>
        </div>
      </div>

      <div class="form-row two-cols">
        <div>
          <label>First Name</label>
          <input type="text" placeholder="First Name">
        </div>
        <div>
          <label>Last Name</label>
          <input type="text" placeholder="Last Name">
        </div>
      </div>

      <div class="form-row">
        <label>Company</label>
        <input type="text" placeholder="Company Name">
      </div>

      <div class="form-row two-cols">
        <div>
          <label>Company VAT*</label>
          <input type="text" placeholder="VAT Number">
        </div>
        <div>
          <label>Mobile Number*</label>
          <input type="text" placeholder="+91 9876543210">
        </div>
      </div>

      <div class="form-row">
        <label>Fiscal Address*</label>
        <input type="text" placeholder="Street, City, State">
      </div>

      <div class="form-row two-cols">
        <div>
          <label>Zip Code*</label>
          <input type="text" placeholder="Zip Code">
        </div>
        <div>
          <label>Country</label>
          <select>
            <option>Select one</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label>Company Activity*</label>
        <select>
          <option>Select one</option>
          <option>Exporter</option>
          <option>Importer</option>
          <option>Producer</option>
        </select>
      </div>

      <div class="form-row">
        <label>Preferred Product(s)</label>
        <div class="checkbox-group">
          <label><input type="checkbox"> Corn</label>
          <label><input type="checkbox"> Almond</label>
          <label><input type="checkbox"> Barley</label>
          <label><input type="checkbox"> Wheat</label>
          <label><input type="checkbox"> Cashew</label>
          <label><input type="checkbox"> Coffee</label>
          <label><input type="checkbox"> Cocoa</label>
          <label><input type="checkbox"> Olive Oil</label>
        </div>
      </div>

      <div class="form-row">
        <label>Other Preferred Product(s)</label>
        <input type="text" placeholder="Other Products">
      </div>

      <div class="form-row">
        <label>Email</label>
        <input type="email" placeholder="example@email.com">
      </div>

      <div class="form-row two-cols">
        <div>
          <label>Password</label>
          <input type="password" placeholder="At least 6 characters">
        </div>
        <div>
          <label>Password Confirmation</label>
          <input type="password" placeholder="Re-enter Password">
        </div>
      </div>

      <div class="form-row terms">
        <label><input type="checkbox"> I agree with the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn">Sign Up</button>
    </form>
  </section>
</body>
</html>
