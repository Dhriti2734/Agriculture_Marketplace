<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Agri Marketplace</title>
    <link rel="stylesheet" href="homee.css">
    <style>
        .signup-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .signup-container input, .signup-container select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .signup-container button {
            width: 100%;
            padding: 12px;
            background: #4b7c2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>AGRI<span>MARKETPLACE</span></h1>
        </div>
        <nav>
            <a href="homee.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="signup-container">
        <h2>Create Your Account</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <select id="userType" required>
                <option value="">Select User Type</option>
                <option value="farmer">Farmer</option>
                <option value="buyer">Buyer</option>
                
            </select>
            <button type="submit">Sign Up</button>
        </form>
        <p id="signupResult" style="margin-top: 15px;"></p>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                userType: document.getElementById('userType').value  // Backend mein ye 'user_type' map karo
            };

            // Basic validation
            if (!formData.name || !formData.email || !formData.password || !formData.userType) {
                document.getElementById('signupResult').innerHTML = '<p style="color: red;">❌ All fields required!</p>';
                return;
            }

            // Password strength basic check 
            if (formData.password.length < 6) {
                document.getElementById('signupResult').innerHTML = '<p style="color: red;">❌ Password must be at least 6 characters!</p>';
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                const resultElement = document.getElementById('signupResult');
                
                if(result.success) {
                    resultElement.innerHTML = '<p style="color: green;">✅ Signup successful! Redirecting to login...</p>';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    
                    resultElement.innerHTML = `<p style="color: red;">❌ ${result.error || 'Signup failed'}</p>`;
                }
            } catch (error) {
                document.getElementById('signupResult').innerHTML = '<p style="color: red;">❌ Connection error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
