<!DOCTYPE html>
<html>
<head>
    <title>Submit Crop - Agri Marketplace</title>
    <link rel="stylesheet" href="homee.css">
    <style>
        .crop-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .crop-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .crop-container button {
            width: 100%;
            padding: 12px;
            background: #4b7c2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>AGRI<span>MARKETPLACE</span></h1>
        </div>
        <nav>
            <a href="homee.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="crop-container">
        <h2>Submit Your Crop for Grading</h2>
        <form id="cropForm">
            <input type="number" id="farmer_id" placeholder="Farmer ID" required>
            <input type="text" id="crop_type" placeholder="Crop Type (e.g., Wheat, Rice)" required>
            <input type="number" id="quantity_kg" placeholder="Quantity (kg)" step="0.01" required>
            <input type="number" id="desired_price_per_kg" placeholder="Desired Price per kg" step="0.01" required>
            <button type="submit">Submit Crop</button>
        </form>
        <div id="cropResult" style="margin-top: 15px;"></div>
        
        <div style="margin-top: 30px;">
            <h3>Recent Submissions</h3>
            <button onclick="loadCrops()">Refresh List</button>
            <div id="cropsList"></div>
        </div>
    </div>

    <script>
        // Submit crop form
        document.getElementById('cropForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                farmer_id: parseInt(document.getElementById('farmer_id').value),
                crop_type: document.getElementById('crop_type').value,
                quantity_kg: parseFloat(document.getElementById('quantity_kg').value),
                desired_price_per_kg: parseFloat(document.getElementById('desired_price_per_kg').value)
            };

            try {
                const response = await fetch('http://localhost:5000/api/batches', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                const resultElement = document.getElementById('cropResult');
                
                if(result.success) {
                    resultElement.innerHTML = `<p style="color: green;">✅ ${result.message} Batch ID: ${result.batch_id}</p>`;
                    loadCrops(); 
                } else {
                    resultElement.innerHTML = `<p style="color: red;">❌ Error: ${result.error}</p>`;
                }
            } catch (error) {
                document.getElementById('cropResult').innerHTML = `<p style="color: red;">❌ Connection error: ${error}</p>`;
            }
        });

        // Load all crops
        async function loadCrops() {
            try {
                const response = await fetch('http://localhost:5000/api/batches');
                const result = await response.json();
                const listElement = document.getElementById('cropsList');
                
                if(result.batches && result.batches.length > 0) {
                    listElement.innerHTML = '<ul>' + result.batches.map(crop => 
                        `<li>Batch ${crop[0]}: ${crop[2]} - ${crop[3]}kg</li>`
                    ).join('') + '</ul>';
                } else {
                    listElement.innerHTML = '<p>No crops submitted yet</p>';
                }
            } catch (error) {
                document.getElementById('cropsList').innerHTML = '<p>Error loading crops</p>';
            }
        }

        // Load crops when page loads
        loadCrops();
    </script>
</body>
</html>
