<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Users - Admin | Agri Marketplace</title>
  <link rel="stylesheet" href="usersd.css">
</head>
<body>
  <!-- keep existing layout/markup (no style changes) -->
  <header>
    <h1>Users</h1>
    <button id="refreshUsers">Refresh</button>
    <button id="exportUsers">Export CSV</button>
  </header>

  <main>
    <table id="usersTable">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

<script>
(function(){
  const API_BASE = location.origin.replace(/:\d+$/,':5000') || 'http://127.0.0.1:5000';
  function api(p){ return API_BASE + p; }

  const tbody = document.querySelector('#usersTable tbody');
  document.getElementById('refreshUsers').addEventListener('click', loadUsers);
  document.getElementById('exportUsers').addEventListener('click', exportUsers);

  async function loadUsers(){
    tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
    try {
      let resp = await fetch(api('/api/admin/users'));
      if (!resp.ok) resp = await fetch(api('/api/users'));
      const data = await resp.json();
      const users = data.users || data || [];
      if (!users.length) { tbody.innerHTML = '<tr><td colspan="5">No users</td></tr>'; return; }
      tbody.innerHTML = '';
      users.forEach(u=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u.id||u.user_id}</td><td>${u.name||u.fullname||''}</td><td>${u.email||''}</td><td>${u.role||'user'}</td>
          <td><button class="impersonate" data-id="${u.id||u.user_id}">Impersonate</button>
              <button class="deleteUser" data-id="${u.id||u.user_id}">Delete</button></td>`;
        tbody.appendChild(tr);
      });
      document.querySelectorAll('.deleteUser').forEach(b=>b.addEventListener('click', deleteUser));
      document.querySelectorAll('.impersonate').forEach(b=>b.addEventListener('click', impersonate));
    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="5">Failed to load users</td></tr>';
    }
  }

  async function deleteUser(e){
    const id = e.currentTarget.dataset.id;
    if (!confirm('Delete user '+id+'?')) return;
    try {
      let resp = await fetch(api(`/api/admin/users/${id}`), { method:'DELETE' });
      if (!resp.ok) resp = await fetch(api(`/api/users/${id}`), { method:'DELETE' });
      if (!resp.ok) {
        const j = await resp.json(); alert('Delete failed: '+(j.error||resp.statusText)); return;
      }
      alert('Deleted');
      loadUsers();
    } catch (err) { console.error(err); alert('Network error'); }
  }

  async function impersonate(e){
    const id = e.currentTarget.dataset.id;
    alert('Impersonation not implemented server-side. You can implement by issuing admin session token on server.');
    // if your backend supports impersonate endpoint, call it here and set token
  }

  async function exportUsers(){
    try {
      let resp = await fetch(api('/api/admin/users/export'));
      if (!resp.ok) resp = await fetch(api('/api/users/export'));
      if (!resp.ok) return alert('Export not available');
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'users.csv'; a.click();
    } catch (err) { console.error(err); alert('Export failed'); }
  }

  // initial
  loadUsers();
})();
</script>
</body>
</html>
