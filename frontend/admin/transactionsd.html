<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Transactions - Admin | Agri Marketplace</title>
  <link rel="stylesheet" href="dashb.css">
</head>
<body>
  <header><h1>Transactions</h1><button id="refreshTx">Refresh</button><button id="exportTx">Export CSV</button></header>

  <main>
    <table id="txTable">
      <thead><tr><th>Txn ID</th><th>Buyer</th><th>Batch</th><th>Qty</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

<script>
(function(){
  const API_BASE = location.origin.replace(/:\d+$/,':5000') || 'http://127.0.0.1:5000';
  function api(p){ return API_BASE + p; }

  const tbody = document.querySelector('#txTable tbody');
  document.getElementById('refreshTx').addEventListener('click', loadTx);
  document.getElementById('exportTx').addEventListener('click', exportTx);

  async function loadTx(){
    tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
    try {
      let resp = await fetch(api('/api/admin/transactions'));
      if (!resp.ok) resp = await fetch(api('/api/transactions'));
      const data = await resp.json();
      const txs = data.transactions || data || [];
      if (!txs.length) { tbody.innerHTML = '<tr><td colspan="6">No transactions</td></tr>'; return; }
      tbody.innerHTML = '';
      txs.forEach(t=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${t.id||t.txn_id}</td><td>${t.buyer_name||t.buyer||'—'}</td><td>${t.batch_id||t.batch||'—'}</td><td>${t.quantity_kg||t.qty||t.quantity||'—'}</td><td>${t.amount||t.total||'—'}</td><td>${t.status||'—'}</td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="6">Failed to load transactions</td></tr>';
    }
  }

  async function exportTx(){
    try {
      let resp = await fetch(api('/api/admin/transactions/export'));
      if (!resp.ok) resp = await fetch(api('/api/transactions/export'));
      if (!resp.ok) return alert('Export not available');
      const blob = await resp.blob(); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'transactions.csv'; a.click();
    } catch (err) { console.error(err); alert('Export failed'); }
  }

  loadTx();
})();
</script>
</body>
</html>
