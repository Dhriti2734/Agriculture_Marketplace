<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transactions | Agri Admin</title>
  <link rel="stylesheet" href="usersd.css">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><h2>Agri Admin</h2></div>
    <ul class="menu">
      <li><a href="dashb.html">Dashboard</a></li>
      <li><a href="usersd.html">Users</a></li>
      <li><a href="cropsd.html">Crops</a></li>
      <li><a href="gradingd.html">Grading Reports</a></li>
      <li class="active"><a href="transactionsd.html">Transactions</a></li>
      <li><a href="homee.html" class="logout">Logout</a></li>
    </ul>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Transactions</h1>
        <p class="subtitle">View and manage transaction records.</p>
      </div>
      <div class="controls">
        <input id="txSearch" type="search" placeholder="Search transactions...">
        <select id="txStatusFilter" class="input">
          <option value="">All status</option>
          <option value="pending">pending</option>
          <option value="completed">completed</option>
          <option value="failed">failed</option>
        </select>
        <button id="btnExportTx" class="btn secondary">Export CSV</button>
      </div>
    </header>

    <section class="content">
      <div class="table-wrap">
        <table id="txTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Buyer</th>
              <th>Seller</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows added by JS -->
          </tbody>
        </table>
      </div>

      <div class="bulk-actions">
        <button id="btnMarkComplete" class="btn">Mark Selected Complete</button>
        <button id="btnDeleteTx" class="btn danger">Delete Selected</button>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Transaction</h3>
      <form id="modalForm">
        <label class="label">Transaction ID</label>
        <input id="t_id" class="input" readonly>

        <label class="label">Buyer</label>
        <input id="t_buyer" class="input">

        <label class="label">Seller</label>
        <input id="t_seller" class="input">

        <label class="label">Amount</label>
        <input id="t_amount" class="input" type="number" step="0.01">

        <label class="label">Status</label>
        <select id="t_status" class="input"><option>pending</option><option>completed</option><option>failed</option></select>

        <label class="label">Date</label>
        <input id="t_date" class="input" type="date">

        <div class="modal-actions">
          <button type="button" id="closeModal" class="btn">Close</button>
          <button type="submit" id="saveModal" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="transactionsd.js"></script>

  <script>
    (function(){
      const links = document.querySelectorAll('.menu a');
      const current = window.location.pathname.split('/').pop();
      links.forEach(a => {
        const hrefFile = a.getAttribute('href') ? a.getAttribute('href').split('/').pop() : '';
        if (hrefFile === current) a.parentElement.classList.add('active');
        else a.parentElement.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
