<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crops - Admin | Agri Marketplace</title>
  <link rel="stylesheet" href="dashb.css">
</head>
<body>
  <header>
    <h1>Crops</h1>
    <button id="refreshCrops">Refresh</button>
    <button id="exportCrops">Export CSV</button>
  </header>

  <main>
    <table id="cropsTable">
      <thead><tr><th>Batch</th><th>Farmer</th><th>Crop</th><th>Qty</th><th>Grade</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>

<script>
(function(){
  const API_BASE = location.origin.replace(/:\d+$/,':5000') || 'http://127.0.0.1:5000';
  function api(p){ return API_BASE + p; }

  const tbody = document.querySelector('#cropsTable tbody');
  document.getElementById('refreshCrops').addEventListener('click', loadCrops);
  document.getElementById('exportCrops').addEventListener('click', exportCrops);

  async function loadCrops(){
    tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
    try {
      let resp = await fetch(api('/api/admin/crops'));
      if (!resp.ok) resp = await fetch(api('/api/batches'));
      const data = await resp.json();
      const items = data.crops || data.batches || data || [];
      if (!items.length) { tbody.innerHTML = '<tr><td colspan="6">No crops</td></tr>'; return; }
      tbody.innerHTML = '';
      items.forEach(c=>{
        const batch = c.batch_id || c.id || '—';
        const farmer = c.farmer_name || c.farmer_id || (c.farmer && c.farmer.name) || '—';
        const crop = c.crop_type || c.crop || '—';
        const qty = c.quantity_kg || c.qty || c.quantity || '—';
        const grade = c.final_grade || c.grade || 'pending';
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${batch}</td><td>${farmer}</td><td>${crop}</td><td>${qty}</td><td>${grade}</td>
          <td><button class="editGrade" data-batch="${batch}">Edit</button></td>`;
        tbody.appendChild(tr);
      });
      document.querySelectorAll('.editGrade').forEach(b=>b.addEventListener('click', editGrade));
    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="6">Failed to load crops</td></tr>';
    }
  }

  async function editGrade(e){
    const batch = e.currentTarget.dataset.batch;
    const newGrade = prompt('Enter new grade for batch '+batch+' (A,B,C)');
    if (!newGrade) return;
    try {
      let resp = await fetch(api(`/api/admin/crops/${batch}/grade`), {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({grade:newGrade})
      });
      if (!resp.ok) resp = await fetch(api(`/api/batches/${batch}/grade`), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({grade:newGrade}) });
      if (!resp.ok) {
        const j = await resp.json(); alert('Save failed: ' + (j.error || resp.statusText)); return;
      }
      alert('Saved');
      loadCrops();
    } catch (err) { console.error(err); alert('Network error'); }
  }

  async function exportCrops(){
    try {
      let resp = await fetch(api('/api/admin/crops/export'));
      if (!resp.ok) resp = await fetch(api('/api/batches/export'));
      if (!resp.ok) return alert('Export not available');
      const blob = await resp.blob(); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'crops.csv'; a.click();
    } catch (err) { console.error(err); alert('Export failed'); }
  }

  loadCrops();
})();
</script>
</body>
</html>
