<!DOCTYPE html>
<html>
<head>
    <title>Login - Agri Marketplace</title>
    <link rel="stylesheet" href="homee.css">

    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #4b7c2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <h1>AGRI<span>MARKETPLACE</span></h1>
        </div>

        <nav>
            <a href="homee.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <div class="login-container">
        <h2>Login to Your Account</h2>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p id="loginResult" style="margin-top: 15px;"></p>
    </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const resultElement = document.getElementById('loginResult');

    if (!email || !password) {
        resultElement.innerHTML = '<p style="color:red;">❌ Email and password required!</p>';
        return;
    }

    try {
        const response = await fetch('http://localhost:5000/api/login', {
            method: 'POST',
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password})
        });

        const result = await response.json();

        if(result.success){

            // ⭐ STORE USER INFO FOR LATER USE
            localStorage.setItem("user_id", result.user_id);   // important
            localStorage.setItem("role", result.role);

            resultElement.innerHTML = '<p style="color:green;">✅ Login successful! Redirecting...</p>';

            setTimeout(() => {

                if (result.role === 'farmer') {
                    window.location.href = "submit-crop.html";
                } 
                else if (result.role === 'buyer') {
                    window.location.href = "market.html";
                } 
                else if (result.role === 'admin') {
                    window.location.href = "admin/dashb.html";
                }

            }, 900);
        } 
        else {
            resultElement.innerHTML = `<p style="color:red;">❌ ${result.error || "Login failed"}</p>`;
        }

    } catch(err){
        resultElement.innerHTML = `<p style="color:red;">❌ Connection error: ${err.message}</p>`;
    }
});
</script>

</body>
</html>
