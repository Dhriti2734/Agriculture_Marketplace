<!DOCTYPE html>
<html>
<head>
    <title>Login - Agri Marketplace</title>
    <link rel="stylesheet" href="homee.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #4b7c2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>AGRI<span>MARKETPLACE</span></h1>
        </div>
        <nav>
            <a href="homee.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </nav>
    </header>

    <div class="login-container">
        <h2>Login to Your Account</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="loginResult" style="margin-top: 15px;"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Basic validation
            if (!email || !password) {
                document.getElementById('loginResult').innerHTML = '<p style="color: red;">❌ Email and password required!</p>';
                return;
            }

            try {
                console.log('Login attempt:', {email});  // Debug: Email log
                
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, password: password})
                });
                
                console.log('Response status:', response.status);  // Debug: Status check
                
                const result = await response.json();
                console.log('Full response:', result);  // Debug: Full result log
                
                const resultElement = document.getElementById('loginResult');
                
                if(result.success) {
                    resultElement.innerHTML = '<p style="color: green;">✅ Login successful! Redirecting...</p>';
                    console.log('Role is:', result.role);  // Debug: Role check
                    
                    // Role-based redirect
                    setTimeout(() => {
                        if (result.role === 'farmer') {
                            console.log('Redirecting to submit-crop.html');  // Debug: Redirect log
                            window.location.href = 'submit-crop.html';
                        } else if (result.role === 'buyer') {
                            console.log('Redirecting to market.html');
                            window.location.href = 'market.html';
                        } else {
                            console.log('Redirecting to dashboard.html');
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                } else {
                    resultElement.innerHTML = `<p style="color: red;">❌ ${result.error || 'Login failed'}</p>`;
                    console.log('Login failed:', result.error);  // Debug: Error log
                }
            } catch (error) {
                console.error('Fetch error:', error);  // Debug: Full error
                document.getElementById('loginResult').innerHTML = '<p style="color: red;">❌ Connection error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
