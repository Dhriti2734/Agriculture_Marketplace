<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agri Marketplace - Market</title>
  <link rel="stylesheet" href="assets/css/market.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>AGRI MARKETPLACE</h1>
    <p>Fairtrade Made Easy</p>
  </header>

  <section class="market">
    <h2>SELECT A PRODUCT TO BUY/SELL</h2>

    <!-- Category Buttons -->
    <div class="buttons">
      <button class="product-btn active" data-type="">🌾 All</button>
      <button class="product-btn" data-type="grains">🌾 GRAINS</button>
      <button class="product-btn" data-type="nuts">🥜 NUTS</button>
      <button class="product-btn" data-type="coffee">☕ GREEN COFFEE</button>
      <button class="product-btn" data-type="carbon">🌿 CARBON CREDITS</button>
      <button class="product-btn" data-type="oils">🫒 OILS</button>
    </div>

    <hr class="divider">

    <!-- Dynamic Product Output -->
    <div class="output" id="output">
      <!-- JS loads cards here -->
    </div>
  </section>

  <footer>
    <p>©2025 Agri Marketplace. Fairtrade Made Easy.</p>
  </footer>

<script>
// ---------------------------------------------
// CONFIG
// ---------------------------------------------
const API_BASE = "http://127.0.0.1:5000";

// DOM Elements
const output = document.getElementById("output");

// ---------------------------------------------
// FETCH MARKET DATA
// ---------------------------------------------
async function loadProducts(filterType = "") {
  output.innerHTML = "<p>Loading products...</p>";

  let response;
  try {
    response = await fetch(`${API_BASE}/api/market`);
    if (!response.ok) response = await fetch(`${API_BASE}/api/batches`);
  } catch (error) {
    output.innerHTML = "<p style='color:red;'>Server offline</p>";
    return;
  }

  const data = await response.json();
  const products = data.items || data.batches || data.crops || [];

  // APPLY FILTER
  const filtered = filterType
    ? products.filter(p =>
        (p.crop_type || "").toLowerCase().includes(filterType)
      )
    : products;

  // EMPTY?
  if (!filtered.length) {
    output.innerHTML = "<p>No products found.</p>";
    return;
  }

  // CLEAR
  output.innerHTML = "";

  // RENDER PRODUCT CARDS
  filtered.forEach(product => {
    const card = document.createElement("div");
    card.className = "product-card";

    const cropImg = product.image_url || "crop_placeholder.png";

    card.innerHTML = `
      <img src="${cropImg}" alt="crop">
      <h3>${product.crop_type || "Crop"}</h3>
      <p><b>Batch:</b> ${product.batch_id}</p>
      <p><b>Quantity:</b> ${product.quantity_kg} kg</p>
      <p><b>Price:</b> ₹${product.desired_price_per_kg}/kg</p>
      <p><b>Grade:</b> ${product.final_grade || "Pending"}</p>
      <button class="product-btn buy-btn" data-id="${product.batch_id}">
        Buy
      </button>
    `;

    output.appendChild(card);
  });

  // ADD BUY EVENT HANDLERS
  document.querySelectorAll(".buy-btn").forEach(btn =>
    btn.addEventListener("click", () => buyProduct(btn.dataset.id))
  );
}

// ---------------------------------------------
// BUY PRODUCT
// ---------------------------------------------
async function buyProduct(batchId) {
  const qty = prompt("Enter quantity to purchase (kg):");

  if (!qty || isNaN(qty) || qty <= 0) {
    alert("Invalid quantity.");
    return;
  }

  const buyerId = localStorage.getItem("buyer_id") || 1;

  try {
    const response = await fetch(`${API_BASE}/api/buy`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        batch_id: batchId,
        buyer_id: buyerId,
        quantity: qty
      })
    });

    const result = await response.json();

    if (result.success) alert("Purchase successful!");
    else alert(result.error || "Purchase failed");
  } catch (error) {
    alert("Server error during purchase.");
  }
}

// ---------------------------------------------
// CATEGORY FILTER BUTTONS
// ---------------------------------------------
document.querySelectorAll(".product-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".product-btn").forEach(b =>
      b.classList.remove("active")
    );
    btn.classList.add("active");

    loadProducts(btn.dataset.type);
  });
});

// Initial load
loadProducts();
</script>

</body>
</html>
