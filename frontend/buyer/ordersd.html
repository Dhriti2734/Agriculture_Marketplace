<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Orders | Agri Marketplace</title>
  <link rel="stylesheet" href="usersd.css">
  <style>
    .orders-table { width:100%; border-collapse: collapse; }
    .orders-table th, .orders-table td { padding:10px 12px; border-bottom:1px solid #eee; text-align:left; }
    .orders-table th { background:#f4f7f4; color:#333 }
    .small { font-size:13px; color:#666 }
    .actions button { margin-right:6px; }
    .modal .order-items { max-height:300px; overflow:auto; margin-top:8px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><h2>Agri Buyer</h2></div>
    <ul class="menu">
      <li><a href="buyerd.html">Dashboard</a></li>
      <li><a href="market.html">Marketplace</a></li>
      <li class="active"><a href="ordersd.html">My Orders</a></li>
      <li><a href="../homee.html" class="logout">Logout</a></li>
    </ul>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h1>My Orders</h1><p class="subtitle">Your order history and details</p></div>
      <div class="controls">
        <input id="orderSearch" class="input" placeholder="Search orders (ID, status)...">
        <button id="exportOrders" class="btn secondary">Export CSV</button>
      </div>
    </header>

    <section class="content">
      <div class="table-wrap">
        <table class="orders-table" id="ordersTable">
          <thead>
            <tr><th>Order ID</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- View Order Modal -->
  <div id="viewModal" class="modal-backdrop" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true" style="width:640px;max-width:calc(100% - 24px);">
      <h3 id="viewTitle">Order</h3>
      <div id="viewBody">
        <div class="small" id="viewDate"></div>
        <div class="order-items" id="viewItems"></div>
        <div style="text-align:right;margin-top:8px;">Total: <strong id="viewTotal"></strong></div>
      </div>
      <div class="modal-actions" style="margin-top:10px;">
        <button id="closeView" class="btn">Close</button>
        <button id="markDelivered" class="btn">Mark Delivered</button>
      </div>
    </div>
  </div>

  <script src="ordersd.js"></script>
  <script>
    (function(){
      const links = document.querySelectorAll('.menu a');
      const current = window.location.pathname.split('/').pop();
      links.forEach(a => {
        const hrefFile = a.getAttribute('href') ? a.getAttribute('href').split('/').pop() : '';
        if (hrefFile === current) a.parentElement.classList.add('active');
        else a.parentElement.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
