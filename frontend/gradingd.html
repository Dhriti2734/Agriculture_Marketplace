<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grading Reports | Agri Admin</title>
  <link rel="stylesheet" href="usersd.css"> <!-- reuse same styles -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><h2>Agri Admin</h2></div>
    <ul class="menu">
      <li><a href="dashb.html">Dashboard</a></li>
      <li><a href="usersd.html">Users</a></li>
      <li><a href="cropsd.html">Crops</a></li>
      <li class="active"><a href="gradingd.html">Grading Reports</a></li>
      <li><a href="transactions.html">Transactions</a></li>
      <li><a href="homee.html" class="logout">Logout</a></li>
    </ul>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Grading Reports</h1>
        <p class="subtitle">View, import, edit and manage grading reports.</p>
      </div>
      <div class="controls">
        <input id="gradeSearch" type="search" placeholder="Search reports...">
        <input id="gradingImport" type="file" accept=".csv">
        <button id="btnBulkGrade" class="btn">Bulk Assign Grade</button>
        <button id="btnExportGrades" class="btn secondary">Export CSV</button>
      </div>
    </header>

    <section class="content">
      <div class="table-wrap">
        <table id="gradingTable">
          <thead>
            <tr>
              <th><input id="gradeSelectAll" type="checkbox" aria-label="Select all reports"></th>
              <th>Batch ID</th>
              <th>Farmer</th>
              <th>Crop</th>
              <th>Grade</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows filled by JS -->
          </tbody>
        </table>
      </div>

      <div class="bulk-actions">
        <button id="btnDeleteSelectedGrades" class="btn danger">Delete Selected</button>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Edit Report</h3>
      <form id="modalForm">
        <label class="label">Batch ID</label>
        <input id="g_batch" class="input" readonly>

        <label class="label">Farmer</label>
        <input id="g_farmer" class="input">

        <label class="label">Crop</label>
        <input id="g_crop" class="input">

        <label class="label">Grade</label>
        <select id="g_grade" class="input">
          <option>A</option><option>B</option><option>C</option>
        </select>

        <label class="label">Date</label>
        <input id="g_date" class="input" type="date">

        <div class="modal-actions">
          <button type="button" id="closeModal" class="btn">Close</button>
          <button type="submit" id="saveModal" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="gradingd.js"></script>

  <script>
    (function(){
      const links = document.querySelectorAll('.menu a');
      const current = window.location.pathname.split('/').pop();
      links.forEach(a => {
        const hrefFile = a.getAttribute('href') ? a.getAttribute('href').split('/').pop() : '';
        if (hrefFile === current) a.parentElement.classList.add('active');
        else a.parentElement.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
