<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crops | Agri Admin</title>
  <link rel="stylesheet" href="usersd.css"><!-- reuse users style for consistency -->
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><h2>Agri Admin</h2></div>
    <ul class="menu">
      <li><a href="dashb.html">Dashboard</a></li>
      <li><a href="usersd.html">Users</a></li>
      <li class="active"><a href="cropsd.html">Crops</a></li>
      <li><a href="grading.html">Grading</a></li>
      <li><a href="transactions.html">Transactions</a></li>
      <li><a href="homee.html" class="logout">Logout</a></li>
    </ul>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Crops</h1>
        <p class="subtitle">Manage crop catalogue: add, edit, delete and export.</p>
      </div>
      <div class="controls">
        <input id="cropSearch" type="search" placeholder="Search crops...">
        <button id="btnAddCrop" class="btn">Add Crop</button>
        <button id="btnExportCrops" class="btn secondary">Export CSV</button>
      </div>
    </header>

    <section class="content">
      <div class="table-wrap">
        <table id="cropsTable">
          <thead>
            <tr>
              <th><input id="selectAllCrops" type="checkbox" aria-label="Select all crops"></th>
              <th>Crop Name</th>
              <th>Category</th>
              <th>Unit</th>
              <th>Price / Unit</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS will populate rows -->
          </tbody>
        </table>
      </div>

      <div class="bulk-actions">
        <button id="btnBulkDeleteCrops" class="btn danger">Delete Selected</button>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Add Crop</h3>
      <form id="modalForm">
        <label class="label">Crop Name</label>
        <input id="c_name" class="input" required>

        <label class="label">Category</label>
        <input id="c_category" class="input" placeholder="e.g. Grains, Nuts">

        <label class="label">Unit</label>
        <input id="c_unit" class="input" placeholder="e.g. kg, ton">

        <label class="label">Price per Unit</label>
        <input id="c_price" class="input" type="number" min="0" step="0.01" placeholder="0.00">

        <div class="modal-actions">
          <button type="button" id="closeModal" class="btn">Close</button>
          <button type="submit" id="saveCrop" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="cropsd.js"></script>

  <script>
    (function(){
      const links = document.querySelectorAll('.menu a');
      const current = window.location.pathname.split('/').pop();
      links.forEach(a => {
        const hrefFile = a.getAttribute('href') ? a.getAttribute('href').split('/').pop() : '';
        if (hrefFile === current) a.parentElement.classList.add('active');
        else a.parentElement.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
